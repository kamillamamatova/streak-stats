name: Update GitHub stats

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats SVG
        run: npm run generate
        env:
          STATS_USERNAME: kamillamamatova
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}

      - name: Commit updated stats
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub streak stats"
          file_pattern: assets/github-streak-stats.svg
